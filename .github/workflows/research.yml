name: Research one place (deep research or analysis)

# Each run is named "<mode> <city> <county> <state>" so the site (js/research.js) can find its own job in the public
# run list and say whether it is queued, running, finished or failed. Keep the two in step.
run-name: ${{ inputs.mode }} ${{ inputs.city }} ${{ inputs.county }} ${{ inputs.state }}

# Started by the "Deep research" and "Analysis" buttons on the site (through api/research.js), or by hand from
# the Actions tab. Runs Claude Code on your Claude plan, for one state, county or city only.
#   mode "deep":     one job. Searches that place in depth and adds new entries to updates.json (checked by scripts/merge.mjs)
#   mode "analysis": three stages. Five specialist researchers (law, utilities, projects, people, sentiment) work at the same
#                    time and each writes a sourced fact sheet; then a writer combines the sheets into a siting brief,
#                    saved to reports/<id>.md and listed in reports/index.json
# Every job builds its inputs with scripts/prep-research.mjs, so they all see the same tracker data.
# Needs the same repository secret as the daily job: CLAUDE_CODE_OAUTH_TOKEN.
# Model and effort are set on every Claude step below, and in update.yml and update-projects.yml; change them together.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "deep = find new entries, analysis = write a brief"
        required: true
        default: deep
        type: choice
        options: [deep, analysis]
      state:
        description: "Two-letter state code, e.g. KS"
        required: true
      county:
        description: "County name with its suffix, e.g. Seward County (leave empty for a state or a city only)"
        default: ""
      city:
        description: "City name, e.g. Liberal (leave empty for a state or county)"
        default: ""
      lookback_days:
        description: "Deep research only: how far back to search"
        default: "365"

permissions:
  contents: write
  id-token: write

concurrency:
  group: research-${{ inputs.mode }}-${{ inputs.state }}-${{ inputs.county }}-${{ inputs.city }}
  cancel-in-progress: false

jobs:
  deep:
    name: Deep research
    if: inputs.mode == 'deep'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the prompt for this place
        env:
          PREP_RUN: "1"
          MODE: deep
          STATE: ${{ inputs.state }}
          COUNTY: ${{ inputs.county }}
          CITY: ${{ inputs.city }}
          LOOKBACK: ${{ inputs.lookback_days }}
        run: node scripts/prep-research.mjs

      - name: Let Claude research this place
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "Follow the instructions in .github/prompts/.run.md exactly."
          # Sonnet 5.5 at medium effort, set here so every run uses the same model and effort.
          claude_args: >-
            --model claude-sonnet-5-5
            --effort medium
            --allowedTools "WebSearch,WebFetch,Read,Write"
            --max-turns 45

      - name: Show what Claude searched
        if: always()
        run: |
          if [ -f research_log.md ]; then
            { echo "### What Claude searched"; echo; cat research_log.md; echo; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Claude wrote no research log, so there is no record of what it searched." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check and merge new entries
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
          ONLY_STATE: ${{ inputs.state }}
          ENTRY_BY: "Deep research: ${{ inputs.city }} ${{ inputs.county }} ${{ inputs.state }}"
        run: |
          node scripts/merge.mjs
          cat update-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to main
        env:
          MODE: deep
          PLACE: ${{ inputs.city }} ${{ inputs.county }} ${{ inputs.state }}
        run: |
          git add updates.json reports
          if git diff --cached --quiet; then echo "Nothing to publish"; exit 0; fi
          git config user.name "data-center-watch-bot"
          git config user.email "data-center-watch-bot@users.noreply.github.com"
          git commit -m "Data Center Watch: $MODE for $PLACE"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          echo "Push failed after 3 tries"; exit 1

  docs:
    name: Fetch documents
    if: inputs.mode == 'analysis'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the record for this place
        env:
          PREP_RUN: "1"
          MODE: analysis
          TOPIC: write
          STATE: ${{ inputs.state }}
          COUNTY: ${{ inputs.county }}
          CITY: ${{ inputs.city }}
        run: node scripts/prep-research.mjs

      - name: Make sure pdftotext is installed
        run: command -v pdftotext >/dev/null || (sudo apt-get update -y -qq && sudo apt-get install -y -qq poppler-utils)

      - name: Download the documents and turn them into text
        env:
          DOCS_RUN: "1"
        run: node scripts/fetch-docs.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs
          if-no-files-found: ignore
          retention-days: 7

  topics:
    name: Research (${{ matrix.topic }})
    needs: docs
    if: ${{ !cancelled() && inputs.mode == 'analysis' }}      # runs even if the documents could not be fetched
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3          # keeps simultaneous sessions within plan rate limits, as in update.yml
      matrix:
        topic: [law, utilities, projects, people, sentiment]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the prompt for this topic
        env:
          PREP_RUN: "1"
          MODE: analysis
          TOPIC: ${{ matrix.topic }}
          STATE: ${{ inputs.state }}
          COUNTY: ${{ inputs.county }}
          CITY: ${{ inputs.city }}
        run: node scripts/prep-research.mjs

      - name: Download the documents
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: docs
          path: docs

      - name: Let Claude research this topic
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "Follow the instructions in .github/prompts/.run.md exactly."
          claude_args: >-
            --model claude-sonnet-5-5
            --effort medium
            --allowedTools "WebSearch,WebFetch,Read,Write"
            --max-turns 60

      - name: Show what this researcher searched
        if: always()
        run: |
          if [ -f facts.md ]; then
            { echo "### Research (${{ matrix.topic }}): searches and pages"; echo; sed -n '/^## Search log/,$p' facts.md; echo; } >> "$GITHUB_STEP_SUMMARY"
            echo "Fact sheet: $(wc -w < facts.md) words, $(grep -c '^- FACT:' facts.md) facts, $(sed -n '/^## Search log/,$p' facts.md | grep -c '^- ') log lines" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "This researcher wrote no fact sheet." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save this topic's fact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facts-${{ matrix.topic }}
          path: facts.md
          if-no-files-found: warn
          retention-days: 7

  write:
    name: Write the brief
    needs: topics
    if: ${{ !cancelled() && inputs.mode == 'analysis' }}      # runs even if one researcher failed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the prompt for the writer
        env:
          PREP_RUN: "1"
          MODE: analysis
          TOPIC: write
          STATE: ${{ inputs.state }}
          COUNTY: ${{ inputs.county }}
          CITY: ${{ inputs.city }}
        run: node scripts/prep-research.mjs

      - name: Download the fact sheets
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: facts-*
          path: facts

      - name: List the fact sheets
        run: |
          echo "Fact sheets found: $(find facts -name facts.md 2>/dev/null | wc -l) of 5" | tee -a "$GITHUB_STEP_SUMMARY"
          find facts -name facts.md 2>/dev/null | sort | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Download the documents
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: docs
          path: docs

      - name: Let Claude write the brief
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "Follow the instructions in .github/prompts/.run.md exactly."
          claude_args: >-
            --model claude-sonnet-5-5
            --effort medium
            --allowedTools "WebSearch,WebFetch,Read,Write"
            --max-turns 60

      - name: Save the report
        env:
          STATE: ${{ inputs.state }}
          COUNTY: ${{ inputs.county }}
          CITY: ${{ inputs.city }}
        run: node scripts/save-report.mjs

      - name: Publish to main
        env:
          MODE: analysis
          PLACE: ${{ inputs.city }} ${{ inputs.county }} ${{ inputs.state }}
        run: |
          git add reports
          if git diff --cached --quiet; then echo "Nothing to publish"; exit 0; fi
          git config user.name "data-center-watch-bot"
          git config user.email "data-center-watch-bot@users.noreply.github.com"
          git commit -m "Data Center Watch: $MODE for $PLACE"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          echo "Push failed after 3 tries"; exit 1
