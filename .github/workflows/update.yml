name: Update Data Center Watch (Claude subscription)

# Runs Claude Code on your Claude plan (no API billing).
# Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN, made with `claude setup-token`.
#
# How it works:
#   1. "search" runs one Claude session per shard (federal/politics + seven regions),
#      each with its own turn budget, and saves what it found as an artifact.
#   2. "publish" combines every shard's finds, checks them with scripts/merge.mjs,
#      and commits new items straight to main. Nothing waits in a pull request.
#
# To backfill a gap: Actions tab > this workflow > Run workflow > set lookback_days (e.g. 16).

on:
  schedule:
    - cron: "0 0,12 * * *"     # twice a day, 00:00 and 12:00 UTC. Each run uses your plan's usage limits.
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many days back to search (raise this to backfill a gap)"
        default: "10"

permissions:
  contents: write
  id-token: write

concurrency:
  group: data-center-watch-update
  cancel-in-progress: false

env:
  LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '10' }}

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3          # keeps simultaneous sessions within plan rate limits
      matrix:
        include:
          - shard: federal-politics
            states: "US"
            focus: "the Federal and Politics beats nationwide (Congress, White House, FERC, DOE, EPA, federal courts, PJM/ERCOT/MISO/SPP, campaigns, polls, national statements, protests). Include state or local items only when they are national news."
          - shard: northeast
            states: "CT DE DC ME MD MA NH NJ NY PA RI VT"
            focus: "State, local and tribal developments in CT, DE, DC, ME, MD, MA, NH, NJ, NY, PA, RI and VT, plus state-level politics there."
          - shard: southeast
            states: "AL FL GA KY MS NC SC TN VA WV"
            focus: "State, local and tribal developments in AL, FL, GA, KY, MS, NC, SC, TN, VA and WV, plus state-level politics there."
          - shard: south-central
            states: "AR LA OK TX"
            focus: "State, local and tribal developments in AR, LA, OK and TX, plus state-level politics there."
          - shard: midwest-lakes
            states: "IL IN MI MN OH WI"
            focus: "State, local and tribal developments in IL, IN, MI, MN, OH and WI, plus state-level politics there."
          - shard: midwest-plains
            states: "IA KS MO NE ND SD"
            focus: "State, local and tribal developments in IA, KS, MO, NE, ND and SD, plus state-level politics there."
          - shard: west-pacific
            states: "AK CA HI OR WA"
            focus: "State, local and tribal developments in AK, CA, HI, OR and WA, plus state-level politics there."
          - shard: west-mountain
            states: "AZ CO ID MT NV NM UT WY"
            focus: "State, local and tribal developments in AZ, CO, ID, MT, NV, NM, UT and WY, plus state-level politics there."
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build this shard's prompt
        env:
          FOCUS: ${{ matrix.focus }}
          STATES: ${{ matrix.states }}
        run: |
          python3 - <<'PY'
          import os, json, datetime
          today = datetime.datetime.now(datetime.timezone.utc).date()
          since = today - datetime.timedelta(days=int(os.environ["LOOKBACK_DAYS"]))
          p = open(".github/prompts/find-updates.md").read()
          p = (p.replace("{{TODAY}}", today.isoformat())
                .replace("{{SINCE}}", since.isoformat())
                .replace("{{FOCUS}}", os.environ["FOCUS"])
                .replace("{{LOOKBACK}}", os.environ["LOOKBACK_DAYS"]))
          open(".github/prompts/.run.md", "w").write(p)
          # A short list of recent items, so Claude doesn't burn turns reading the 900 KB updates.json.
          cutoff = (today - datetime.timedelta(days=180)).isoformat()
          rows = []
          for f in ("data/entries.json", "updates.json"):
              for e in json.load(open(f)):
                  if str(e.get("d", "")) >= cutoff:
                      rows.append(f'{e.get("d","")} {e.get("j","")} {e.get("t","")}')
          open(".github/prompts/.known.txt", "w").write("\n".join(sorted(set(rows), reverse=True)) + "\n")
          print(f"Window {since}..{today}, {len(rows)} known recent items")
          # Open threads in this shard's area: tracked items whose outcome may not be logged yet
          # (votes, ballot measures, campaigns, statements, polls, pauses, scheduled dates).
          # Claude searches for what happened next, even when the outcome story never says "data center".
          area = set(os.environ["STATES"].split())
          cut = (today - datetime.timedelta(days=120)).isoformat()
          open_st = {"pending", "ballot", "campaign", "statement", "poll", "pause"}
          threads = []
          for f in ("data/entries.json", "updates.json"):
              for e in json.load(open(f)):
                  d, j = str(e.get("d", "")), e.get("j", "")
                  if not ((j in area) or ("US" in area and e.get("lv") == "federal")):
                      continue
                  if d >= cut and (e.get("st") in open_st or e.get("k") == "politics" or d > today.isoformat()):
                      where = ", ".join(p[0] for p in (e.get("pl") or []) if p)
                      threads.append(f'{d} {j} [{e.get("st","")}] {e.get("t","")}' + (f" ({where})" if where else ""))
          threads = sorted(set(threads), reverse=True)[:200]
          # One standing check per state, so every state gets searched even when it has no open thread.
          checks = [f"STATE-CHECK {s}" for s in sorted(area - {"US"})]
          if "US" in area:
              checks.append("STATE-CHECK US (federal: Congress, FERC, DOE, EPA, courts, grid operators, national campaigns and polls)")
          threads = checks + threads   # state checks first, so they are never the part that gets skipped
          open(".github/prompts/.threads.txt", "w").write("\n".join(threads) + "\n")
          print(f"{len(threads)} open threads for {sorted(area)}")
          PY

      - name: Let Claude search the web
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "Follow the instructions in .github/prompts/.run.md exactly."
          # Sonnet 5.5 at medium effort, set here so every run uses the same model and effort.
          claude_args: >-
            --model claude-sonnet-5-5
            --effort medium
            --allowedTools "WebSearch,WebFetch,Read,Write"
            --max-turns 100

      - name: Save this shard's finds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidates-${{ matrix.shard }}
          path: |
            candidates.json
            coverage.json
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: search
    if: always()               # publish whatever the shards that succeeded found
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download every shard's finds
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: candidates-*
          path: cands

      - name: Combine shards
        run: |
          shopt -s nullglob
          files=(cands/*/candidates.json)
          echo "Shard files found: ${#files[@]}"
          : > all.jsonl
          for f in "${files[@]}"; do
            sed -e 's/```json//g' -e 's/```//g' "$f" | jq -c 'if type == "array" then . else [] end' >> all.jsonl \
              || echo "Skipping $f: not valid JSON"
          done
          if [ -s all.jsonl ]; then jq -s 'add' all.jsonl > candidates.json; else echo "[]" > candidates.json; fi
          rm -f all.jsonl
          echo "Combined candidates: $(jq length candidates.json)"

      - name: Coverage report
        run: |
          {
            echo "### Search coverage"
            echo ""
            echo "| Shard | Rows | Done | Todo |"
            echo "|---|---|---|---|"
            for d in cands/*/; do
              s=$(basename "$d" | sed 's/^candidates-//')
              if [ -f "$d/coverage.json" ] && jq -e 'type == "array"' "$d/coverage.json" >/dev/null 2>&1; then
                echo "| $s | $(jq length "$d/coverage.json") | $(jq '[.[] | select(.outcome != "todo")] | length' "$d/coverage.json") | $(jq '[.[] | select(.outcome == "todo")] | length' "$d/coverage.json") |"
              else
                echo "| $s | no coverage.json | | |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check and merge what Claude found
        run: |
          node scripts/merge.mjs
          cat update-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to main
        run: |
          if git diff --quiet updates.json; then echo "No changes"; exit 0; fi
          git config user.name "data-center-watch-bot"
          git config user.email "data-center-watch-bot@users.noreply.github.com"
          git add updates.json
          git commit -m "Data Center Watch: new developments" -m "$(cat update-summary.md)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          echo "Push failed after 3 tries"; exit 1
