name: Update Data Center Watch (Claude subscription)

# Runs Claude Code on your Claude plan (no API billing).
# Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN, made with `claude setup-token`.

on:
  schedule:
    - cron: "0 12 * * *"      # once a day, 12:00 UTC. Each run uses your plan's usage limits.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: data-center-watch-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fill in today's date
        run: |
          TODAY=$(date -u +%F); SINCE=$(date -u -d "4 days ago" +%F)
          sed -e "s/{{TODAY}}/$TODAY/" -e "s/{{SINCE}}/$SINCE/" .github/prompts/find-updates.md > /tmp/run-prompt.md
          cp /tmp/run-prompt.md .github/prompts/.run.md

      - name: Let Claude search the web
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "Follow the instructions in .github/prompts/.run.md exactly."
          claude_args: >-
            --allowedTools "WebSearch,WebFetch,Read,Write"
            --max-turns 60

      - name: Check and merge what Claude found
        run: |
          rm -f .github/prompts/.run.md
          node scripts/merge.mjs

      - name: Open a pull request for review
        if: ${{ vars.AUTO_PUBLISH != 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/data-center-watch-updates
          delete-branch: true
          add-paths: updates.json
          commit-message: "Data Center Watch: new developments"
          title: "Data Center Watch: new developments for review"
          body-path: update-summary.md
          labels: auto-update

      - name: Publish directly
        if: ${{ vars.AUTO_PUBLISH == 'true' }}
        run: |
          if git diff --quiet updates.json; then echo "No changes"; exit 0; fi
          git config user.name "data-center-watch-bot"
          git config user.email "data-center-watch-bot@users.noreply.github.com"
          git add updates.json && git commit -m "Data Center Watch: new developments" && git push
